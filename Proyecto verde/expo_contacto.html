<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Expo Tecno Verde - Contacto</title>

    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(#e8f5e9, #c8e6c9);
            margin: 0;
            padding: 0;
        }

        /* ===== HEADER ===== */
        header {
            position: relative; /* para logo gigante de fondo */
            background: linear-gradient(90deg, #2e7d32, #1b5e20);
            color: white;
            padding: 60px 30px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            overflow: hidden;
        }

        /* Logo gigante transparente de fondo */
        .header-logo-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 1600px; /* ajusta tamaño si quieres */
            opacity: 0.08;
            transform: translate(-50%, -50%);
            z-index: 0;
        }

        /* Contenido del header */
        .contenido-header {
            position: relative;
            z-index: 10;
        }

        .contenido-header img {
            width: 110px;
            margin-bottom: 10px;
            filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.4));
        }

        .contenido-header h1 {
            margin: 0;
            font-size: 32px;
        }

        .contenido-header p.subtitulo {
            margin-top: 6px;
            font-size: 18px;
            opacity: 0.9;
        }

        /* ===== CONTENEDOR ===== */
        .container {
            width: 85%;
            max-width: 900px;
            margin: 40px auto;
            background: #ffffffcc;
            backdrop-filter: blur(3px);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 18px rgba(0,0,0,0.15);
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }

        h3 {
            color: #1b5e20;
            border-left: 5px solid #43a047;
            padding-left: 10px;
            font-size: 22px;
            margin-bottom: 15px;
        }

        /* ===== FORMULARIO ===== */
        form label {
            font-weight: 600;
            color: #2e7d32;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #a5d6a7;
            margin-top: 5px;
            margin-bottom: 18px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
        }

        input:focus, textarea:focus {
            outline: none;
            border: 1px solid #66bb6a;
            box-shadow: 0 0 6px #a5d6a7;
        }

        button {
            background: #2e7d32;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            background: #1b5e20;
            transform: scale(1.03);
        }

        /* ===== INFORMACIÓN DE CONTACTO ===== */
        .info-box {
            background: #f1f8e9;
            padding: 18px;
            border-radius: 12px;
            margin-top: 20px;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.1);
            color: #2e7d32;
        }

        .info-box p {
            margin: 8px 0;
            font-size: 16px;
        }

        .info-box strong {
            color: #1b5e20;
        }
    </style>
</head>
<body>

<header>
    <!-- Logo gigante transparente -->
    <img src="conciencia.png" alt="Logo fondo" class="header-logo-bg">

    <div class="contenido-header">
      
        <h1>Contáctanos</h1>
        <p class="subtitulo">Estamos aquí para ayudarte</p>
    </div>
</header>

<div class="container">

    <h3>Formulario de contacto</h3>

    <form>
        <label>Nombre completo:</label>
        <input type="text" placeholder="Tu nombre">

        <label>Correo electrónico:</label>
        <input type="email" placeholder="correo@ejemplo.com">

        <label>Teléfono:</label>
        <input type="tel" placeholder="0999999999">

        <label>Asunto:</label>
        <input type="text" placeholder="Motivo del mensaje">

        <label>Mensaje:</label>
        <textarea rows="6" placeholder="Escribe tu mensaje aquí..."></textarea>

        <button type="button">Enviar mensaje</button>
    </form>

    <h3>Información de contacto</h3>

    <div class="info-box">
        <p><strong>📍 Dirección:</strong> Av. 25 de Agosto y Chimborazo – La Troncal</p>
        <p><strong>📧 Correo:</strong> expoverde@istlt.edu.ec</p>
        <p><strong>☎ Teléfono:</strong> 099-999-9999</p>
        <p><strong>🕒 Horarios:</strong> Lunes a Viernes, 08:00 – 17:00</p>
    </div>

</div>

</body>
</html>
